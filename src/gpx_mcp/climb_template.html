<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--card:#f3f3f5;--bd:#d8d8dc}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#f2f2f4;--mut:#9a9aa2;--card:#222226;--bd:#38383d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px}
h1{font-size:18px;margin:4px 0 2px}.sub{color:var(--mut);margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--card);border-radius:8px;padding:8px 10px}.stat b{display:block;font-size:17px}.stat span{color:var(--mut);font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;padding:5px 12px;font:inherit;cursor:pointer}
button.on{background:#e8590c;border-color:#e8590c;color:#fff}
#map{height:430px;border-radius:10px;border:1px solid var(--bd)}
#chart{width:100%;height:190px;display:block;margin-top:8px;background:var(--card);border-radius:10px}
.legend{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--mut);font-size:12px}
.bar{height:10px;flex:1;max-width:260px;border-radius:5px}
#read{margin-top:6px;color:var(--mut);min-height:20px}
</style></head><body><div class="wrap">
<h1>__TITLE__</h1><div class="sub">__SUBTITLE__</div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div class="legend"><span id="lmin"></span><div class="bar" id="bar"></div><span id="lmax"></span><span id="lname"></span></div>
<div id="map"></div><canvas id="chart"></canvas><div id="read">Hover the chart or the line</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA=__DATA__;const R=DATA.rows, C0=DATA.c0, C1=DATA.c1;
const M={hr:{n:'Heart rate',u:'bpm',lo:100,hi:170},pw:{n:'Power',u:'W',lo:100,hi:__PWHI__},spd:{n:'Speed',u:'km/h',lo:4,hi:25},
 cr:{n:'Climb rate',u:'m/h',lo:0,hi:1100},gr:{n:'Gradient',u:'%',lo:0,hi:14},cad:{n:'Cadence',u:'rpm',lo:40,hi:90},alt:{n:'Elevation',u:'m',lo:null,hi:null}};
const stops=['#2b6cb0','#2fa8a0','#8bc34a','#f6c026','#e8590c','#b3122f'];
function col(v,m){if(v==null)return'#888';let t=(v-m.lo)/(m.hi-m.lo);t=Math.max(0,Math.min(1,t));const x=t*(stops.length-1),i=Math.min(stops.length-2,Math.floor(x));return mix(stops[i],stops[i+1],x-i)}
function mix(a,b,f){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(',')+')'}
const clm=R.slice(C0,C1+1);const avg=k=>{const v=clm.map(r=>r[k]).filter(x=>x!=null);return v.reduce((a,b)=>a+b,0)/v.length};
const mx=k=>Math.max(...clm.map(r=>r[k]).filter(x=>x!=null));
const mins=((clm.at(-1).t-clm[0].t)/60);
const st=[['Distance',(clm.at(-1).km-clm[0].km).toFixed(2)+' km'],['Gain',Math.round(clm.at(-1).alt-clm[0].alt)+' m'],['Time',Math.floor(mins)+':'+String(Math.round((mins%1)*60)).padStart(2,'0')],
['Avg HR',Math.round(avg('hr'))+' bpm'],['Max HR',mx('hr')+' bpm'],['Avg power',Math.round(avg('pw'))+' W'],['Max power',mx('pw')+' W'],['Avg speed',avg('spd').toFixed(1)+' km/h'],['VAM',Math.round((clm.at(-1).alt-clm[0].alt)/(mins/60))+' m/h'],['Max grade',mx('gr').toFixed(1)+'%']];
document.getElementById('stats').innerHTML=st.map(s=>'<div class="stat"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>').join('');
const map=L.map('map');const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
const topo=L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'});
osm.addTo(map);L.control.layers({'OpenStreetMap':osm,'OpenTopoMap (OSM-based, contours)':topo},null,{position:'topright'}).addTo(map);
const ll=R.map(r=>[r.lat,r.lon]);map.fitBounds(L.latLngBounds(ll),{padding:[20,20]});
let lines=[],cur='hr',mk=L.circleMarker(ll[0],{radius:7,color:'#fff',weight:2,fillColor:'#111',fillOpacity:1}).addTo(map);
function setRange(k){const m=M[k];if(k==='alt'){const v=R.map(r=>r.alt);m.lo=Math.min(...v);m.hi=Math.max(...v)}}
function draw(){lines.forEach(l=>map.removeLayer(l));lines=[];const m=M[cur];setRange(cur);
 for(let i=1;i<R.length;i++){const l=L.polyline([ll[i-1],ll[i]],{color:col(R[i][cur],m),weight:6,opacity:i<=C0||i>C1?0.35:1}).addTo(map);l.on('mouseover',()=>hover(i));lines.push(l)}
 mk.bringToFront();document.getElementById('lmin').textContent=Math.round(m.lo)+' '+m.u;document.getElementById('lmax').textContent=Math.round(m.hi)+' '+m.u;document.getElementById('lname').textContent=m.n;
 document.getElementById('bar').style.background='linear-gradient(90deg,'+stops.join(',')+')';
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));chart()}
const tabs=document.getElementById('tabs');Object.keys(M).forEach(k=>{const b=document.createElement('button');b.textContent=M[k].n;b.dataset.k=k;b.onclick=()=>{cur=k;draw()};tabs.appendChild(b)});
const cv=document.getElementById('chart'),cx=cv.getContext('2d');let W,H;
function chart(){const dpr=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
 const pad={l:46,r:46,t:10,b:22},w=W-pad.l-pad.r,h=H-pad.t-pad.b,kmx=R.at(-1).km;const X=km=>pad.l+km/kmx*w;
 const al=R.map(r=>r.alt),a0=Math.min(...al),a1=Math.max(...al);const Y=a=>pad.t+h-(a-a0)/(a1-a0)*h;
 cx.beginPath();cx.moveTo(X(0),pad.t+h);R.forEach(r=>cx.lineTo(X(r.km),Y(r.alt)));cx.lineTo(X(kmx),pad.t+h);cx.closePath();cx.fillStyle='rgba(128,128,140,.25)';cx.fill();
 const css=getComputedStyle(document.body);cx.fillStyle=css.color;cx.font='11px system-ui';cx.fillText(Math.round(a1)+' m',4,pad.t+8);cx.fillText(Math.round(a0)+' m',4,pad.t+h);cx.fillText('0',pad.l,H-6);cx.fillText(kmx.toFixed(1)+' km',W-pad.r-34,H-6);
 if(cur!=='alt'){const m=M[cur],Y2=v=>pad.t+h-(v-m.lo)/(m.hi-m.lo)*h;cx.lineWidth=2;for(let i=1;i<R.length;i++){const v=R[i][cur],u=R[i-1][cur];if(v==null||u==null)continue;cx.beginPath();cx.strokeStyle=col(v,m);cx.moveTo(X(R[i-1].km),Y2(Math.max(m.lo,Math.min(m.hi,u))));cx.lineTo(X(R[i].km),Y2(Math.max(m.lo,Math.min(m.hi,v))));cx.stroke()}
  cx.fillStyle=css.color;cx.fillText(m.hi+' '+m.u,W-pad.r+4,pad.t+8);cx.fillText(m.lo+' '+m.u,W-pad.r+4,pad.t+h)}
 cx.strokeStyle='rgba(120,120,130,.6)';cx.setLineDash([4,3]);[C0,C1].forEach(i=>{cx.beginPath();cx.moveTo(X(R[i].km),pad.t);cx.lineTo(X(R[i].km),pad.t+h);cx.stroke()});cx.setLineDash([]);
 if(hi!=null){cx.strokeStyle=css.color;cx.beginPath();cx.moveTo(X(R[hi].km),pad.t);cx.lineTo(X(R[hi].km),pad.t+h);cx.stroke()}}
let hi=null;function hover(i){hi=i;const r=R[i];mk.setLatLng(ll[i]);
 document.getElementById('read').innerHTML='<b>'+(r.km-R[C0].km).toFixed(2)+' km</b> &middot; '+r.alt+' m &middot; HR '+(r.hr??'-')+' &middot; '+(r.pw??'-')+' W &middot; '+r.spd+' km/h &middot; '+r.cr+' m/h &middot; '+r.gr+'% &middot; '+(r.cad??'-')+' rpm';chart()}
cv.addEventListener('mousemove',e=>{const x=e.offsetX-46,kmx=R.at(-1).km,km=Math.max(0,Math.min(kmx,x/(cv.clientWidth-92)*kmx));let b=0;for(let i=0;i<R.length;i++)if(Math.abs(R[i].km-km)<Math.abs(R[b].km-km))b=i;hover(b)});
addEventListener('resize',chart);draw();
</script></body></html>
